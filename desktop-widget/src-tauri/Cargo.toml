[package]
name = "ssc-buddy-desktop-widget"
version = "1.0.0"
description = "SSC Buddy floating task widget"
authors = ["SSC Buddy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }

windows-registry = "0.6.1"
